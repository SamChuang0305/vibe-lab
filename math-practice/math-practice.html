<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學計算練習</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-6 text-2xl font-bold">數學計算練習</h1>

    <section id="setupPanel" class="rounded-lg bg-white p-6 shadow">
      <h2 class="mb-4 text-lg font-semibold">設定</h2>
      <div class="grid gap-4 sm:grid-cols-2">
        <fieldset class="flex flex-col gap-2 sm:col-span-2">
          <legend class="text-sm font-medium">題目種類</legend>
          <div class="grid gap-2 sm:grid-cols-2">
            <label class="inline-flex items-center gap-2">
              <input id="opAdd" type="checkbox" value="add" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>加法計算 ➕</span>
            </label>
            <label class="inline-flex items-center gap-2">
              <input id="opSub" type="checkbox" value="sub" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>減法計算 ➖</span>
            </label>
            <label class="inline-flex items-center gap-2">
              <input id="opMul" type="checkbox" value="mul" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>乘法計算 ✖</span>
            </label>
            <label class="inline-flex items-center gap-2">
              <input id="opDiv" type="checkbox" value="div" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>除法計算 ➗</span>
            </label>
          </div>
        </fieldset>

        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">題目數量（1~200）</span>
          <input id="questionCount" type="number" min="1" max="200" value="10" class="rounded border border-slate-300 px-3 py-2" />
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-sm font-medium">加、減法數字最大值</span>
          <select id="digitLength" class="rounded border border-slate-300 px-3 py-2">
            <option value="1">個位數（1~9）</option>
            <option value="2">十位數（1~99）</option>
            <option value="3">百位數（1~999）</option>
          </select>
        </label>

        <fieldset class="flex flex-col gap-2">
          <legend class="text-sm font-medium">乘、除法出題範圍（至少必須選一種，可複選）</legend>
          <div class="flex flex-col gap-2 rounded border border-slate-300 px-3 py-2">
            <label class="inline-flex items-center gap-2">
              <input id="mulDivRange9" type="checkbox" value="9" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>9x9（2x2 ~ 9x9）</span>
            </label>
            <label class="inline-flex items-center gap-2">
              <input id="mulDivRange20" type="checkbox" value="20" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>20x20（11x2 ~ 20x20）</span>
            </label>
          </div>
        </fieldset>

        <label class="flex flex-col gap-1 sm:col-span-2">
          <span class="text-sm font-medium">單題答題時間</span>
          <select id="timeMode" class="rounded border border-slate-300 px-3 py-2">
            <option value="limited" selected>限定秒數</option>
            <option value="unlimited">無時間限制</option>
          </select>
        </label>

        <label id="secondsWrap" class="flex flex-col gap-1 sm:col-span-2">
          <span class="text-sm font-medium">秒數（1~60，預設 10 秒）</span>
          <input id="timeLimit" type="number" min="1" max="60" value="10" class="rounded border border-slate-300 px-3 py-2" />
        </label>
      </div>

      <button id="startBtn" class="mt-6 w-full rounded bg-blue-600 px-5 py-3 text-base font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 sm:w-auto">開始練習</button>
      <p id="setupError" class="mt-3 hidden rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700"></p>
    </section>

    <section id="quizPanel" class="hidden rounded-lg bg-white p-6 shadow">
      <div class="mb-3 flex items-center justify-between text-sm text-slate-600">
        <p id="progressText">第 1 / 10 題</p>
        <p id="timerText">剩餘時間：10 秒</p>
      </div>

      <p id="questionText" class="mb-4 text-3xl font-bold">1 ➕ 2 = ?</p>

      <div class="flex flex-wrap items-center gap-2">
        <input id="answerInput" type="number" inputmode="numeric" class="w-full rounded border border-slate-300 px-3 py-3 text-base sm:w-52" placeholder="請輸入答案" />
        <button id="submitBtn" class="w-full rounded bg-green-600 px-5 py-3 text-base font-semibold text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-300 sm:w-auto">送出</button>
        <button id="clearBtn" class="w-full rounded bg-slate-500 px-5 py-3 text-base font-semibold text-white hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-300 sm:w-auto">清空</button>
        <button id="leaveBtn" class="w-full rounded bg-rose-600 px-5 py-3 text-base font-semibold text-white hover:bg-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-300 sm:w-auto">離開</button>
      </div>
      <p id="quizError" class="mt-3 hidden rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm font-medium text-amber-700"></p>
    </section>

    <section id="resultPanel" class="hidden rounded-lg bg-white p-6 shadow">
      <h2 class="mb-4 text-lg font-semibold">作答結果</h2>
      <p id="scoreText" class="mb-4 text-base font-medium"></p>
      <div class="mb-4 rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
        <p class="mb-2 text-sm font-semibold text-slate-700">本次設定</p>
        <ul id="configSummaryList" class="list-disc space-y-1 pl-5 text-sm text-slate-700"></ul>
      </div>
      <p id="earlyExitText" class="mb-4 hidden rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm font-medium text-amber-700">提早結束</p>

      <div class="overflow-x-auto">
        <table class="min-w-full border border-slate-300 text-left text-sm">
          <thead class="bg-slate-100">
            <tr>
              <th class="border border-slate-300 px-3 py-2">題號</th>
              <th class="border border-slate-300 px-3 py-2">題目種類</th>
              <th class="border border-slate-300 px-3 py-2">題目</th>
              <th class="border border-slate-300 px-3 py-2">你的答案</th>
              <th class="border border-slate-300 px-3 py-2">正確答案</th>
              <th class="border border-slate-300 px-3 py-2">作答結果</th>
              <th class="border border-slate-300 px-3 py-2">作答時間</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <button id="restartBtn" class="mt-6 w-full rounded bg-blue-600 px-5 py-3 text-base font-semibold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 sm:w-auto">重新開始</button>
    </section>
  </main>

  <script>
    const setupPanel = document.getElementById('setupPanel');
    const quizPanel = document.getElementById('quizPanel');
    const resultPanel = document.getElementById('resultPanel');

    const questionCountInput = document.getElementById('questionCount');
    const digitLengthSelect = document.getElementById('digitLength');
    const timeModeSelect = document.getElementById('timeMode');
    const timeLimitInput = document.getElementById('timeLimit');
    const mulDivRange9Input = document.getElementById('mulDivRange9');
    const mulDivRange20Input = document.getElementById('mulDivRange20');
    const secondsWrap = document.getElementById('secondsWrap');
    const setupError = document.getElementById('setupError');
    const opAddInput = document.getElementById('opAdd');
    const opSubInput = document.getElementById('opSub');
    const opMulInput = document.getElementById('opMul');
    const opDivInput = document.getElementById('opDiv');

    const startBtn = document.getElementById('startBtn');
    const progressText = document.getElementById('progressText');
    const timerText = document.getElementById('timerText');
    const questionText = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const clearBtn = document.getElementById('clearBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const quizError = document.getElementById('quizError');

    const scoreText = document.getElementById('scoreText');
    const configSummaryList = document.getElementById('configSummaryList');
    const earlyExitText = document.getElementById('earlyExitText');
    const resultBody = document.getElementById('resultBody');
    const restartBtn = document.getElementById('restartBtn');

    let questions = [];
    let currentIndex = 0;
    let timerId = null;
    let remainingSeconds = 0;
    let currentQuestionStartedAt = null;
    let endedEarly = false;
    let config = {
      operationTypes: ['add', 'sub', 'mul', 'div'],
      questionCount: 10,
      digitLength: 1,
      mulDivRanges: ['9', '20'],
      timeMode: 'limited',
      timeLimit: 10
    };

    function setInvalid(input, isInvalid, borderTarget = input) {
      borderTarget.classList.toggle('border-red-500', isInvalid);
      borderTarget.classList.toggle('ring-2', isInvalid);
      borderTarget.classList.toggle('ring-red-200', isInvalid);
    }

    function showSetupError(message) {
      setupError.textContent = message;
      setupError.classList.remove('hidden');
    }

    function clearSetupError() {
      setupError.textContent = '';
      setupError.classList.add('hidden');
    }

    function showQuizError(message) {
      quizError.textContent = message;
      quizError.classList.remove('hidden');
    }

    function clearQuizError() {
      quizError.textContent = '';
      quizError.classList.add('hidden');
    }

    function resumeTimerIfNeeded() {
      if (config.timeMode !== 'limited') {
        return;
      }
      timerId = setInterval(() => {
        remainingSeconds -= 1;
        if (remainingSeconds <= 0) {
          timerText.textContent = '剩餘時間：0 秒';
          submitCurrentAnswer(true);
          return;
        }
        timerText.textContent = `剩餘時間：${remainingSeconds} 秒`;
      }, 1000);
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getOperationMeta(type) {
      if (type === 'add') {
        return { symbol: '➕', label: '加法計算 ➕' };
      }
      if (type === 'sub') {
        return { symbol: '➖', label: '減法計算 ➖' };
      }
      if (type === 'mul') {
        return { symbol: '✖', label: '乘法計算 ✖' };
      }
      return { symbol: '➗', label: '除法計算 ➗' };
    }

    function getAddSubMaxValue(digitLength) {
      if (digitLength === 1) return 9;
      if (digitLength === 2) return 99;
      return 999;
    }

    function getMulDivRange(rangeType) {
      if (rangeType === '20') {
        return { leftMin: 11, leftMax: 20, rightMin: 2, rightMax: 20 };
      }
      return { leftMin: 2, leftMax: 9, rightMin: 2, rightMax: 9 };
    }

    function generateQuestion(digitLength, operationTypes, mulDivRanges) {
      const addSubMin = 1;
      const addSubMax = getAddSubMaxValue(digitLength);
      const operationType = operationTypes[randomInt(0, operationTypes.length - 1)];
      const operation = getOperationMeta(operationType);
      let mulLeftMin = 2;
      let mulLeftMax = 9;
      let mulRightMin = 2;
      let mulRightMax = 9;
      if ((operationType === 'mul' || operationType === 'div') && mulDivRanges.length > 0) {
        const selectedMulDivRange = mulDivRanges[randomInt(0, mulDivRanges.length - 1)];
        const range = getMulDivRange(selectedMulDivRange);
        mulLeftMin = range.leftMin;
        mulLeftMax = range.leftMax;
        mulRightMin = range.rightMin;
        mulRightMax = range.rightMax;
      }

      let a = randomInt(addSubMin, addSubMax);
      let b = randomInt(addSubMin, addSubMax);
      let correct = 0;
      if (operationType === 'add') {
        correct = a + b;
      } else if (operationType === 'sub') {
        let found = false;
        for (let i = 0; i < 500; i += 1) {
          a = randomInt(addSubMin, addSubMax);
          b = randomInt(addSubMin, addSubMax);
          if (a !== b) {
            found = true;
            break;
          }
        }
        if (!found) {
          a = addSubMin + 1;
          b = addSubMin;
        }
        if (a < b) {
          [a, b] = [b, a];
        }
        correct = a - b;
      } else if (operationType === 'mul') {
        a = randomInt(mulLeftMin, mulLeftMax);
        b = randomInt(mulRightMin, mulRightMax);
        correct = a * b;
      } else {
        b = randomInt(mulRightMin, mulRightMax);
        const quotient = randomInt(mulLeftMin, mulLeftMax);
        a = b * quotient;
        correct = quotient;
      }

      return {
        a,
        b,
        operationType,
        operationSymbol: operation.symbol,
        operationLabel: operation.label,
        correct,
        userAnswer: null,
        timeout: false,
        elapsedSeconds: 0
      };
    }

    function getQuestionKey(question) {
      return `${question.operationType}:${question.a}:${question.b}`;
    }

    function buildUniqueQuestions(questionCount, digitLength, operationTypes, mulDivRanges) {
      const uniqueQuestions = [];
      const seen = new Set();
      const maxAttempts = Math.max(questionCount * 50, 1000);
      let attempts = 0;

      while (uniqueQuestions.length < questionCount && attempts < maxAttempts) {
        attempts += 1;
        const question = generateQuestion(digitLength, operationTypes, mulDivRanges);
        const key = getQuestionKey(question);
        if (seen.has(key)) {
          continue;
        }
        seen.add(key);
        uniqueQuestions.push(question);
      }

      return uniqueQuestions;
    }

    function parseSetup() {
      const operationTypes = [];
      if (opAddInput.checked) operationTypes.push('add');
      if (opSubInput.checked) operationTypes.push('sub');
      if (opMulInput.checked) operationTypes.push('mul');
      if (opDivInput.checked) operationTypes.push('div');
      const questionCount = Number(questionCountInput.value);
      const digitLength = Number(digitLengthSelect.value);
      const mulDivRanges = [];
      if (mulDivRange9Input.checked) mulDivRanges.push('9');
      if (mulDivRange20Input.checked) mulDivRanges.push('20');
      const timeMode = timeModeSelect.value;
      const timeLimit = Number(timeLimitInput.value);

      const operationInputs = [opAddInput, opSubInput, opMulInput, opDivInput];
      const mulDivRangeInputs = [mulDivRange9Input, mulDivRange20Input];
      operationInputs.forEach((input) => setInvalid(input, false, input));
      mulDivRangeInputs.forEach((input) => setInvalid(input, false, input.parentElement.parentElement));
      setInvalid(questionCountInput, false);
      setInvalid(digitLengthSelect, false);
      setInvalid(timeLimitInput, false);

      if (operationTypes.length === 0) {
        operationInputs.forEach((input) => setInvalid(input, true, input));
        return '題目種類至少需勾選一種。';
      }
      const requiresMulDivRange = operationTypes.includes('mul') || operationTypes.includes('div');
      if (!Number.isInteger(questionCount) || questionCount < 1 || questionCount > 200) {
        setInvalid(questionCountInput, true);
        return '題目數量請輸入 1 到 200 的整數。';
      }
      if (![1, 2, 3].includes(digitLength)) {
        setInvalid(digitLengthSelect, true);
        return '加、減法數字最大值設定不正確。';
      }
      if (requiresMulDivRange && mulDivRanges.length === 0) {
        mulDivRangeInputs.forEach((input) => setInvalid(input, true, input.parentElement.parentElement));
        return '乘、除法出題範圍至少需勾選一種。';
      }
      if (!['limited', 'unlimited'].includes(timeMode)) {
        return '時間模式設定不正確。';
      }
      if (timeMode === 'limited' && (!Number.isInteger(timeLimit) || timeLimit < 1 || timeLimit > 60)) {
        setInvalid(timeLimitInput, true);
        return '限定秒數請輸入 1 到 60 的整數。';
      }

      config = {
        operationTypes,
        questionCount,
        digitLength,
        mulDivRanges,
        timeMode,
        timeLimit: timeMode === 'limited' ? timeLimit : 0
      };
      return null;
    }

    function startQuiz() {
      clearSetupError();
      const error = parseSetup();
      if (error) {
        showSetupError(error);
        return;
      }

      questions = buildUniqueQuestions(
        config.questionCount,
        config.digitLength,
        config.operationTypes,
        config.mulDivRanges
      );
      if (questions.length < config.questionCount) {
        showSetupError('在目前設定下無法產生足夠的不重複題目，請調整題目數量、加減法數字最大值、乘除法出題範圍或題目種類。');
        return;
      }
      currentIndex = 0;
      endedEarly = false;

      setupPanel.classList.add('hidden');
      resultPanel.classList.add('hidden');
      quizPanel.classList.remove('hidden');

      renderQuestion();
    }

    function renderQuestion() {
      clearInterval(timerId);

      const q = questions[currentIndex];
      progressText.textContent = `第 ${currentIndex + 1} / ${questions.length} 題`;
      questionText.textContent = `${q.a} ${q.operationSymbol} ${q.b} = ?`;
      answerInput.value = '';
      currentQuestionStartedAt = Date.now();
      clearQuizError();
      setInvalid(answerInput, false);
      answerInput.focus();

      if (config.timeMode === 'limited') {
        remainingSeconds = config.timeLimit;
        timerText.textContent = `剩餘時間：${remainingSeconds} 秒`;
        resumeTimerIfNeeded();
      } else {
        timerText.textContent = '剩餘時間：無時間限制';
      }
    }

    function submitCurrentAnswer(byTimeout = false) {
      clearInterval(timerId);

      const q = questions[currentIndex];
      const elapsed = Math.max(0, Math.ceil((Date.now() - currentQuestionStartedAt) / 1000));
      if (byTimeout) {
        q.userAnswer = null;
        q.timeout = true;
        q.elapsedSeconds = config.timeMode === 'limited' ? config.timeLimit : elapsed;
      } else {
        const value = answerInput.value.trim();
        if (value === '') {
          showQuizError('請先輸入答案再送出。');
          setInvalid(answerInput, true);
          answerInput.focus();
          resumeTimerIfNeeded();
          return;
        }
        const parsedValue = Number(value);
        if (!Number.isFinite(parsedValue)) {
          showQuizError('答案格式不正確，請輸入數字。');
          setInvalid(answerInput, true);
          answerInput.focus();
          resumeTimerIfNeeded();
          return;
        }
        clearQuizError();
        setInvalid(answerInput, false);
        q.userAnswer = parsedValue;
        q.elapsedSeconds = elapsed;
      }

      currentIndex += 1;
      if (currentIndex >= questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    function finishQuiz() {
      quizPanel.classList.add('hidden');
      resultPanel.classList.remove('hidden');
      earlyExitText.classList.toggle('hidden', !endedEarly);

      let correctCount = 0;
      let wrongCount = 0;
      resultBody.innerHTML = '';
      const selectedOperations = config.operationTypes.map((type) => getOperationMeta(type).label).join('、');
      const addSubRangeLabel = config.digitLength === 1 ? '1~9' : config.digitLength === 2 ? '1~99' : '1~999';
      const usesMulDiv = config.operationTypes.includes('mul') || config.operationTypes.includes('div');
      const mulDivRangeLabel = usesMulDiv
        ? config.mulDivRanges
          .map((rangeType) => (rangeType === '9' ? '9x9（2x2 ~ 9x9）' : '20x20（11x2 ~ 20x20）'))
          .join('、')
        : '不適用';
      const timeModeLabel = config.timeMode === 'limited' ? `限定秒數（${config.timeLimit} 秒）` : '無時間限制';
      configSummaryList.innerHTML = '';
      [
        `題目種類：${selectedOperations}`,
        `題目數量：${config.questionCount}`,
        `加、減法數字最大值：${addSubRangeLabel}`,
        `乘、除法出題範圍：${mulDivRangeLabel}`,
        `單題答題時間：${timeModeLabel}`
      ].forEach((text) => {
        const li = document.createElement('li');
        li.textContent = text;
        configSummaryList.appendChild(li);
      });

      questions.forEach((q, index) => {
        const isCorrect = q.userAnswer === q.correct;
        if (isCorrect) {
          correctCount += 1;
        } else {
          wrongCount += 1;
        }

        const tr = document.createElement('tr');

        const indexTd = document.createElement('td');
        indexTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        indexTd.textContent = String(index + 1);

        const problemTd = document.createElement('td');
        problemTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        problemTd.textContent = `${q.a} ${q.operationSymbol} ${q.b}`;

        const operationTd = document.createElement('td');
        operationTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        operationTd.textContent = q.operationLabel;

        const userTd = document.createElement('td');
        userTd.className = `border border-slate-300 px-3 py-2 ${isCorrect ? 'text-slate-900' : 'text-red-600'}`;
        if (q.timeout) {
          userTd.textContent = '超時';
        } else if (q.userAnswer === null || Number.isNaN(q.userAnswer)) {
          userTd.textContent = '(未作答)';
        } else {
          userTd.textContent = String(q.userAnswer);
        }

        const correctTd = document.createElement('td');
        correctTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        correctTd.textContent = String(q.correct);

        const resultTd = document.createElement('td');
        resultTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        if (q.timeout) {
          resultTd.textContent = '❌ 超時';
          resultTd.className = 'border border-slate-300 px-3 py-2 text-red-600';
        } else if (q.userAnswer === null || Number.isNaN(q.userAnswer)) {
          resultTd.textContent = '❌ 未作答';
          resultTd.className = 'border border-slate-300 px-3 py-2 text-red-600';
        } else if (!isCorrect) {
          resultTd.textContent = '❌ 錯誤';
          resultTd.className = 'border border-slate-300 px-3 py-2 text-red-600';
        } else {
          resultTd.textContent = '🟢 正確';
          resultTd.className = 'border border-slate-300 px-3 py-2 text-green-600';
        }

        const elapsedTd = document.createElement('td');
        elapsedTd.className = 'border border-slate-300 px-3 py-2 text-slate-900';
        elapsedTd.textContent = `${q.elapsedSeconds} 秒`;

        tr.appendChild(indexTd);
        tr.appendChild(operationTd);
        tr.appendChild(problemTd);
        tr.appendChild(userTd);
        tr.appendChild(correctTd);
        tr.appendChild(resultTd);
        tr.appendChild(elapsedTd);
        resultBody.appendChild(tr);
      });

      scoreText.textContent = `答對 ${correctCount} 題，答錯 ${wrongCount} 題`;
    }

    startBtn.addEventListener('click', startQuiz);
    submitBtn.addEventListener('click', () => submitCurrentAnswer(false));
    function clearCurrentAnswer() {
      answerInput.value = '';
      clearQuizError();
      setInvalid(answerInput, false);
      answerInput.focus();
    }
    clearBtn.addEventListener('click', clearCurrentAnswer);
    leaveBtn.addEventListener('click', () => {
      const confirmed = window.confirm('確認要離開？將會直接顯示作答結果');
      if (!confirmed) {
        return;
      }
      if (currentIndex < questions.length) {
        const q = questions[currentIndex];
        if (!q.timeout && q.userAnswer === null) {
          q.elapsedSeconds = Math.max(0, Math.ceil((Date.now() - currentQuestionStartedAt) / 1000));
        }
      }
      endedEarly = true;
      clearInterval(timerId);
      finishQuiz();
    });
    restartBtn.addEventListener('click', () => {
      clearInterval(timerId);
      resultPanel.classList.add('hidden');
      quizPanel.classList.add('hidden');
      setupPanel.classList.remove('hidden');
    });

    answerInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        submitCurrentAnswer(false);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        clearCurrentAnswer();
      }
    });
    answerInput.addEventListener('input', () => {
      clearQuizError();
      setInvalid(answerInput, false);
    });

    timeModeSelect.addEventListener('change', () => {
      const isLimited = timeModeSelect.value === 'limited';
      secondsWrap.classList.toggle('hidden', !isLimited);
    });
    questionCountInput.addEventListener('input', () => {
      clearSetupError();
      setInvalid(questionCountInput, false);
    });
    [opAddInput, opSubInput, opMulInput, opDivInput].forEach((input) => {
      input.addEventListener('change', () => {
        clearSetupError();
        setInvalid(input, false, input);
      });
    });
    digitLengthSelect.addEventListener('change', () => {
      clearSetupError();
      setInvalid(digitLengthSelect, false);
    });
    [mulDivRange9Input, mulDivRange20Input].forEach((input) => {
      input.addEventListener('change', () => {
        clearSetupError();
        setInvalid(input, false, input.parentElement.parentElement);
      });
    });
    timeLimitInput.addEventListener('input', () => {
      clearSetupError();
      setInvalid(timeLimitInput, false);
    });
  </script>
</body>
</html>
